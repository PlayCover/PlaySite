name: update site data

on:
  schedule: [{cron: '0 0 * * *'}]
  workflow_dispatch:
  push: {branches: [master, main]}

permissions:
  contents: write

concurrency:
  group: update-site-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The scripts only use Node built-ins, so no `npm install` is needed here.
      - run: node scripts/getReleasesInformation.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/getRepoInformation.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: '[:robot: BOT] Update orgContributors.json and releases.json'
          file_pattern: orgContributors.json releases.json
          # By default the action sets the *author* to whoever triggered the run
          # (the last person to push / edit this workflow), which makes every bot
          # commit show up as "<you> and github-actions[bot]". Make the bot the
          # sole author and committer instead.
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          create_branch: false
